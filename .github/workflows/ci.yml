name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned rather than "latest": that previously resolved to a build
          # too old to lint a go1.25+ module and silently broke every run.
          # v6 of this action doesn't support golangci-lint v2 at all.
          version: v2.13.0

  npm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: syntax check
        run: |
          node --check npm/bin/socialsight.js
          node --check npm/scripts/postinstall.js
      - name: pack and install against the real release matching package.json's version
        run: |
          cd npm
          npm pack --pack-destination /tmp
          mkdir -p /tmp/npm-smoke
          npm install -g --prefix /tmp/npm-smoke /tmp/socialsight-cli-*.tgz
          /tmp/npm-smoke/bin/socialsight version
