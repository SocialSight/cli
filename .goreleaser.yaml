version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: socialsight
    main: ./cmd/socialsight
    binary: socialsight
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/SocialSight/cli/internal/cli.version={{.Version}}
      - -X github.com/SocialSight/cli/internal/cli.commit={{.Commit}}
      - -X github.com/SocialSight/cli/internal/cli.date={{.Date}}

archives:
  - id: socialsight
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^ci:"

release:
  github:
    owner: SocialSight
    name: cli

brews:
  - name: socialsight
    repository:
      owner: SocialSight
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Don't fail the whole release if the cross-repo token isn't set yet;
    # just skip updating the tap (the rest of the release still succeeds).
    # `eq` is a core Go template function, unlike `envOrDefault` (a
    # GoReleaser/Sprig extension that turned out not to be registered in
    # the template context skip_upload is actually evaluated in at publish
    # time -- confirmed by a real release failing on it, v2.18.0). Direct
    # .Env field access is safe here because the release workflow's env:
    # block always defines this key (empty string if the secret is unset),
    # so it's never a template.
    skip_upload: "{{ eq .Env.HOMEBREW_TAP_GITHUB_TOKEN \"\" }}"
    directory: Formula
    homepage: "https://github.com/SocialSight/cli"
    description: "Generate images and videos with SocialSight models"
    license: "MIT"
    install: |
      bin.install "socialsight"
    test: |
      system "#{bin}/socialsight", "version"
